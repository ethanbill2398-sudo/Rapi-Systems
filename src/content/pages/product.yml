seo:
  title: "RapiTower & RapiTruss | Bolt-Together Grain Towers"
  description: "How the RapiTower and RapiTruss bolted system works: galvanized structural steel, minimal unique pieces, no site welding. Specs, FAQ and downloads."
hero:
  heading: "RapiTower & RapiTruss"
  subheading: "A bolted structural system for grain leg towers, catwalks and stairs."
  image:
    src: ../../assets/images/stair-tower-catwalk-truss-assembly.webp
    alt: "Stair tower with switchback stairs beside grain bins while catwalk truss sections are assembled on the ground"
system:
  heading: "How the bolted system works"
  body: "RapiSYSTEMS elements are fabricated from heavy galvanized structural steel sections with a minimum of welded or custom sheet metal parts. A small set of common pieces bolts together in thousands of configurations, from small bins to very large bins and equipment, so each structure is configured to order without being custom-built from scratch."
  image:
    src: ../../assets/images/rapitower-rapitruss-component-drawing.webp
    alt: "3D line drawing of the RapiTower and RapiTruss system showing towers, 2-post frames and catwalk sections"
  points:
    - title: "Common structural elements"
      text: "Standard steel sections repeat across every tower and truss, which keeps unique pieces to a minimum."
      icon: stairs
    - title: "Fully bolted connections"
      text: "Members bolt together on site. Welding is practically eliminated from the project."
      icon: nut
    - title: "Galvanized finish"
      text: "Every piece is galvanized for durability and corrosion resistance in prairie weather."
      icon: shield-check
    - title: "Configured to order"
      text: "Heights, lengths, widths and attachments are set to your bins, legs and conveyors."
      icon: gear-six
steps:
  heading: "From your yard plan to standing steel"
  items:
    - title: "Configure"
      text: "We lay out towers, catwalks and stairs around your bins and equipment."
      icon: path
    - title: "Engineer"
      text: "The configuration is checked for your site, with an engineer when required."
      icon: blueprint
    - title: "Fabricate & galvanize"
      text: "Common structural sections are cut, drilled and galvanized."
      icon: shield-check
    - title: "Ship"
      text: "Components ship from the prairies to anywhere in Canada."
      icon: truck-trailer
    - title: "Bolt together on site"
      text: "Griffin Ag installs it, or any qualified crew can bolt it up. No welding crew needed."
      icon: wrench
comparison:
  heading: "Bolted vs. welded structure"
  text: "Custom welded structure has its place. For bin access and conveyor support, a bolted system usually gets you there faster."
  rows:
    - label: "Install time"
      bolted: "Pre-made sections bolt together quickly on site"
      welded: "Custom pieces fabricated and fitted one project at a time"
    - label: "Labour"
      bolted: "General crew with hand and power tools"
      welded: "Certified welders and fitters on site"
    - label: "Site welding"
      bolted: "Practically none"
      welded: "Hot work on site near grain and dust"
    - label: "Retrofitting existing bins"
      bolted: "Add a catwalk or conveyor to the bins you have"
      welded: "Custom structure designed around each bin"
    - label: "Lead time"
      bolted: "Common pieces, no long custom fabrication"
      welded: "Long fabrication and install times"
