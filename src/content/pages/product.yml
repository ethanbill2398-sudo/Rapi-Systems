faq:
  heading: "Frequently asked questions"
  items:
    - question: "Does a RapiSYSTEMS tower need welding on site?"
      answer: "No. RapiTower and RapiTruss are fully bolted systems built from common structural steel pieces, which practically eliminates welding from a bin access project."
    - question: "Can I add a catwalk to my existing grain bins?"
      answer: "Yes. RapiSYSTEMS was designed so farms can economically add a catwalk or conveyor system to an existing bin setup without specialized custom structure or long fabrication and install times."
    - question: "What sizes are RapiTower grain leg towers available in?"
      answer: "According to the RapiSYSTEMS brochure, towers range from 6 ft wide by 20 ft tall up to 160 ft tall, in 5 ft increments. Contact us to confirm sizes for your site."
    - question: "How long can a RapiTruss catwalk be?"
      answer: "RapiTruss catwalks and equipment supports can be configured to any required length in 5 ft increments, up to 400 ft, with supports placed at nearly any point along the length."
    - question: "Can stairs be added to a tower?"
      answer: "Yes. Wrap-around stairs are available as an option on RapiTower support towers."
    - question: "Is the steel galvanized?"
      answer: "Yes. All RapiSYSTEMS structure is galvanized for maximum durability and corrosion resistance."
    - question: "Who should install my RapiSYSTEMS structure?"
      answer: "We recommend Griffin Ag Services. They developed the system, know every piece, and can handle the install from delivery to the final bolt. Any qualified crew can also bolt it together, and we will ship the structure to them anywhere in Canada."
    - question: "Do you ship outside Saskatchewan?"
      answer: "Yes. RapiSYSTEMS structure is sold direct and shipped across Canada. Griffin Ag Services also offers installation across Western Canada."
    - question: "Can you install the structure for us?"
      answer: "Yes. Griffin Ag Services, the team that developed RapiSYSTEMS, is the recommended installer and works across Western Canada with its own heavy equipment, manlifts and tool trailers. Because the system bolts together, any qualified crew can also install it. Visit griffinagservices.com or ask for installation in your quote."
cta:
  heading: "Get a quote on RapiSYSTEMS structure"
  text: "Send us your bin layout and equipment list. We will configure the towers and catwalks to suit."
